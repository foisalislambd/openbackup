# Auto-release: every push to main creates a version tag and a GitHub Release
# with CLI binaries (cross-compiled), Windows and Linux desktop apps, and
# container images on Docker Hub and GHCR (latest + version tags).
#
# Skip a release for a docs-only / WIP commit by including [skip release] in the
# commit message. You can also run this workflow manually (Actions → Release)
# and optionally set an exact tag like v0.3.0.
#
# Auto versioning: patch runs 0–9, then the minor bumps
# (v0.1.9 → v0.2.0, v0.2.9 → v0.3.0).
#
# Docker Hub push needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# GHCR push uses GITHUB_TOKEN (packages: write).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact tag (e.g. v0.2.0). Leave empty to auto-bump (…9 → next minor.0).'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.13.0'

jobs:
  version:
    name: Decide version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide next tag
        id: decide
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          msg=$(git log -1 --pretty=%B)
          if printf '%s' "$msg" | grep -qi '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Skipping release ([skip release] in commit message)."
            exit 0
          fi

          if [ -n "${INPUT_VERSION:-}" ]; then
            tag="$INPUT_VERSION"
          else
            git fetch --tags --force
            last=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$last" ]; then
              tag="v0.1.0"
            else
              # vMAJOR.MINOR.PATCH — patch stays 0–9; after .9 bump minor
              # (v0.1.9 → v0.2.0, v0.2.9 → v0.3.0). Also rolls up if last
              # patch is already ≥9 (e.g. a leftover v0.1.10 → v0.2.0).
              ver=${last#v}
              major=${ver%%.*}
              rest=${ver#*.}
              minor=${rest%%.*}
              patch=${rest#*.}
              patch=${patch%%[!0-9]*}
              if [ -z "$patch" ]; then patch=0; fi
              next_patch=$((patch + 1))
              if [ "$next_patch" -gt 9 ]; then
                minor=$((minor + 1))
                next_patch=0
              fi
              tag="v${major}.${minor}.${next_patch}"
            fi
          fi

          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — skipping duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $tag"

  cli:
    name: CLI + server binaries
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release binaries
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: make release

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-cli
          path: dist/*
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # windows-latest does not ship makensis; Wails -nsis needs it on PATH.
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build desktop + NSIS installer
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          PRODUCT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          command -v makensis
          # Keep Windows file version / NSIS DisplayVersion in sync with the GitHub tag.
          node -e "
            const fs = require('fs');
            const path = 'wails.json';
            const j = JSON.parse(fs.readFileSync(path, 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = process.env.PRODUCT_VERSION;
            fs.writeFileSync(path, JSON.stringify(j, null, 2) + '\n');
            console.log('wails productVersion=', j.info.productVersion);
          "
          LDFLAGS="-s -w -X github.com/foisalislambd/openbackup/internal/version.Version=${VERSION} -X github.com/foisalislambd/openbackup/internal/version.Commit=${GITHUB_SHA::7} -X github.com/foisalislambd/openbackup/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # One -nsis build produces both the app and the installer.
          wails build -nsis -trimpath -ldflags "$LDFLAGS"
          mkdir -p dist
          cp build/bin/openbackup-desktop.exe dist/openbackup-desktop-windows-amd64.exe
          ls -la build/bin
          installer=$(ls build/bin/*installer*.exe build/bin/*-setup.exe build/bin/*Setup*.exe 2>/dev/null | head -n1 || true)
          if [ -z "$installer" ]; then
            for f in build/bin/*.exe; do
              base=$(basename "$f")
              case "$base" in
                openbackup-desktop.exe) ;;
                *) installer=$f; break ;;
              esac
            done
          fi
          test -n "$installer"
          cp "$installer" dist/openbackup-desktop-windows-amd64-setup.exe
          ls -la dist
          test -f dist/openbackup-desktop-windows-amd64.exe
          test -f dist/openbackup-desktop-windows-amd64-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-windows
          path: desktop/dist/*
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          LDFLAGS="-s -w -X github.com/foisalislambd/openbackup/internal/version.Version=${VERSION} -X github.com/foisalislambd/openbackup/internal/version.Commit=${GITHUB_SHA::7} -X github.com/foisalislambd/openbackup/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -trimpath -ldflags "$LDFLAGS" -tags webkit2_41
          mkdir -p dist
          cp build/bin/openbackup-desktop dist/openbackup-desktop-linux-amd64
          cp build/linux/openbackup-desktop.desktop dist/
          cp build/appicon.png dist/openbackup.png
          chmod 755 dist/openbackup-desktop-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-linux
          path: desktop/dist/*
          if-no-files-found: error

  docker:
    name: Publish Docker image
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version metadata
        id: meta
        run: |
          set -eu
          # GHCR requires lowercase names; official form is ghcr.io/<owner>/<repo>.
          image=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          tag='${{ needs.version.outputs.tag }}'
          ver='${{ needs.version.outputs.version }}'
          {
            echo "version=${tag}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "foisalislambd/openbackup:latest"
            echo "foisalislambd/openbackup:${tag}"
            echo "foisalislambd/openbackup:${ver}"
            echo "${image}:latest"
            echo "${image}:${tag}"
            echo "${image}:${ver}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=openbackup
            org.opencontainers.image.description=OpenBackup server
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Create GitHub Release
    needs: [version, cli, desktop-windows, desktop-linux, docker]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          # Only release assets — not Docker buildx/GHA cache artifacts
          # (e.g. *.dockerbuild), which appear when the docker job runs in the
          # same workflow and break a blanket download.
          pattern: openbackup-*
          path: artifacts
          merge-multiple: false

      - name: Stage release files
        run: |
          set -eu
          mkdir -p release
          cp artifacts/openbackup-cli/* release/
          cp artifacts/openbackup-desktop-windows/* release/
          cp artifacts/openbackup-desktop-linux/* release/
          cd release
          # Refresh checksums for the full set of assets.
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          notes=$(printf '%s\n' \
            "## OpenBackup ${TAG}" \
            "" \
            "Automated release from \`main\`." \
            "" \
            "### Downloads" \
            "- **Windows desktop:** \`openbackup-desktop-windows-amd64-setup.exe\` (installer) or \`.exe\` (portable) — window + background agent in one binary" \
            "- **Linux desktop:** \`openbackup-desktop-linux-amd64\` (+ \`.desktop\` + \`openbackup.png\`) — same: GUI + agent in one binary" \
            "- **Agent / server CLI:** \`openbackup-<os>-<arch>\` and \`openbackup-server-<os>-<arch>\` (optional; for headless/servers or the terminal)" \
            "- **Server container (Docker Hub):** \`docker pull foisalislambd/openbackup:${TAG}\` (also tagged \`latest\`)" \
            "- **Server container (GHCR):** \`docker pull ghcr.io/foisalislambd/openbackup:${TAG}\` (also tagged \`latest\`)" \
            "" \
            "### Notes" \
            "- Linux desktop needs WebKitGTK 4.1 at runtime (\`libwebkit2gtk-4.1-0\` on Debian/Ubuntu)." \
            "- macOS desktop is not built in CI yet — use \`make desktop\` on a Mac." \
            "- Agent/server CLI binaries are static; desktop apps are native per OS." \
          )

          gh release create "$TAG" release/* \
            --title "OpenBackup ${TAG}" \
            --notes "$notes" \
            --latest
