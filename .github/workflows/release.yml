# Auto-release: every push to main creates a version tag and a GitHub Release
# with CLI binaries (cross-compiled) plus Windows and Linux desktop apps.
#
# Skip a release for a docs-only / WIP commit by including [skip release] in the
# commit message. You can also run this workflow manually (Actions → Release)
# and optionally set an exact tag like v0.3.0.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact tag (e.g. v0.3.0). Leave empty to auto-bump patch.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.13.0'

jobs:
  version:
    name: Decide version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide next tag
        id: decide
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          msg=$(git log -1 --pretty=%B)
          if printf '%s' "$msg" | grep -qi '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Skipping release ([skip release] in commit message)."
            exit 0
          fi

          if [ -n "${INPUT_VERSION:-}" ]; then
            tag="$INPUT_VERSION"
          else
            git fetch --tags --force
            last=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$last" ]; then
              tag="v0.1.0"
            else
              # vMAJOR.MINOR.PATCH → bump PATCH
              ver=${last#v}
              major=${ver%%.*}
              rest=${ver#*.}
              minor=${rest%%.*}
              patch=${rest#*.}
              patch=${patch%%[!0-9]*}
              if [ -z "$patch" ]; then patch=0; fi
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — skipping duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $tag"

  cli:
    name: CLI + server binaries
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release binaries
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: make release

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-cli
          path: dist/*
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop + NSIS installer
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          LDFLAGS="-s -w -X github.com/foisalislambd/openbackup/internal/version.Version=${VERSION} -X github.com/foisalislambd/openbackup/internal/version.Commit=${GITHUB_SHA::7} -X github.com/foisalislambd/openbackup/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -trimpath -ldflags "$LDFLAGS"
          wails build -nsis -trimpath -ldflags "$LDFLAGS"
          mkdir -p dist
          # Portable app
          if [ -f build/bin/openbackup-desktop.exe ]; then
            cp build/bin/openbackup-desktop.exe dist/openbackup-desktop-windows-amd64.exe
          fi
          # NSIS installer (Wails names vary slightly by version)
          installer=$(ls build/bin/*installer*.exe build/bin/*setup*.exe 2>/dev/null | head -n1 || true)
          if [ -n "$installer" ]; then
            cp "$installer" dist/openbackup-desktop-windows-amd64-setup.exe
          else
            # Fall back: ship whatever extra exe Wails produced besides the app.
            for f in build/bin/*.exe; do
              base=$(basename "$f")
              case "$base" in
                openbackup-desktop.exe) ;;
                *) cp "$f" "dist/openbackup-desktop-windows-amd64-setup.exe"; break ;;
              esac
            done
          fi
          ls -la dist
          test -f dist/openbackup-desktop-windows-amd64.exe
          test -f dist/openbackup-desktop-windows-amd64-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-windows
          path: desktop/dist/*
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          LDFLAGS="-s -w -X github.com/foisalislambd/openbackup/internal/version.Version=${VERSION} -X github.com/foisalislambd/openbackup/internal/version.Commit=${GITHUB_SHA::7} -X github.com/foisalislambd/openbackup/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -trimpath -ldflags "$LDFLAGS" -tags webkit2_41
          mkdir -p dist
          cp build/bin/openbackup-desktop dist/openbackup-desktop-linux-amd64
          cp build/linux/openbackup-desktop.desktop dist/
          cp build/appicon.png dist/openbackup.png
          chmod 755 dist/openbackup-desktop-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-linux
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [version, cli, desktop-windows, desktop-linux]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release files
        run: |
          set -eu
          mkdir -p release
          cp artifacts/openbackup-cli/* release/
          cp artifacts/openbackup-desktop-windows/* release/
          cp artifacts/openbackup-desktop-linux/* release/
          cd release
          # Refresh checksums for the full set of assets.
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          notes=$(printf '%s\n' \
            "## OpenBackup ${TAG}" \
            "" \
            "Automated release from \`main\`." \
            "" \
            "### Downloads" \
            "- **Windows desktop:** \`openbackup-desktop-windows-amd64-setup.exe\` (installer) or \`.exe\` (portable)" \
            "- **Linux desktop:** \`openbackup-desktop-linux-amd64\` (+ \`.desktop\` + \`openbackup.png\`)" \
            "- **Agent / server CLI:** \`openbackup-<os>-<arch>\` and \`openbackup-server-<os>-<arch>\`" \
            "" \
            "### Notes" \
            "- Linux desktop needs WebKitGTK 4.1 at runtime (\`libwebkit2gtk-4.1-0\` on Debian/Ubuntu)." \
            "- macOS desktop is not built in CI yet — use \`make desktop\` on a Mac." \
            "- Agent/server binaries are static; desktop apps are native per OS." \
          )

          gh release create "$TAG" release/* \
            --title "OpenBackup ${TAG}" \
            --notes "$notes" \
            --latest
