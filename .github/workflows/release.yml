# Release: a push to main (or a manual run) reads VERSION.md and, only when
# that semver is strictly greater than the latest git tag and GitHub Release,
# tags vX.Y.Z and publishes CLI binaries, Windows and Linux desktop apps, and
# container images on Docker Hub and GHCR (latest + version tags).
#
# The same or a lower version skips the release jobs and says why. Tests still
# run in ci.yml. Put [skip release] in the commit message to skip even when
# VERSION.md is newer.
#
# Docker Hub push needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# GHCR push uses GITHUB_TOKEN (packages: write).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.13.0'

jobs:
  version:
    name: Decide version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      product: ${{ steps.decide.outputs.product }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Read VERSION.md and compare with releases
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          msg=$(git log -1 --pretty=%B)
          if printf '%s' "$msg" | grep -qi '\[skip release\]'; then
            {
              echo "skip=true"
              echo "tag="
              echo "version="
              echo "product="
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Skipping release ([skip release] in the commit message)."
            exit 0
          fi

          git fetch --tags --force origin
          tmp=$(mktemp)
          git tag -l 'v*' > "$tmp"
          gh release list --limit 200 --json tagName --jq '.[].tagName' >> "$tmp"

          # Invalid VERSION.md fails this step (the release does not run).
          # A version that is not strictly newer exits 0 with skip=true.
          out=$(go run ./internal/version/cmd decide < "$tmp")
          printf '%s\n' "$out"
          skip=$(printf '%s\n' "$out" | awk -F= '/^skip=/{print substr($0, index($0, "=")+1); exit}')
          version=$(printf '%s\n' "$out" | awk -F= '/^version=/{print substr($0, index($0, "=")+1); exit}')
          tag=$(printf '%s\n' "$out" | awk -F= '/^tag=/{print substr($0, index($0, "=")+1); exit}')
          product=$(printf '%s\n' "$out" | awk -F= '/^product=/{print substr($0, index($0, "=")+1); exit}')
          message=$(printf '%s\n' "$out" | awk -F= '/^message=/{print substr($0, index($0, "=")+1); exit}')
          {
            echo "skip=$skip"
            echo "version=$version"
            echo "tag=$tag"
            echo "product=$product"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$message"
          if [ "$skip" = "true" ]; then
            echo "::notice title=Release skipped::$message"
          else
            echo "::notice title=Releasing::$message"
          fi

  cli:
    name: CLI + server binaries
    needs: version
    if: needs.version.result == 'success' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release binaries
        run: make release

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-cli
          path: dist/*
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows)
    needs: version
    if: needs.version.result == 'success' && needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # windows-latest does not ship makensis; Wails -nsis needs it on PATH.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build desktop + NSIS installer
        working-directory: desktop
        shell: bash
        run: |
          set -eu
          command -v makensis
          # Windows file version / NSIS DisplayVersion come from VERSION.md.
          (cd .. && go run ./internal/version/cmd stamp-wails desktop/wails.json)
          export COMMIT="${GITHUB_SHA::7}"
          LDFLAGS=$(cd .. && sh scripts/go-ldflags.sh .)
          # One -nsis build produces both the app and the installer.
          wails build -nsis -trimpath -ldflags "$LDFLAGS"
          mkdir -p dist
          cp build/bin/openbackup-desktop.exe dist/openbackup-desktop-windows-amd64.exe
          find build/bin -maxdepth 1 -type f -print
          installer=$(find build/bin -maxdepth 1 -type f \( -name '*installer*.exe' -o -name '*-setup.exe' -o -name '*Setup*.exe' \) | head -n1 || true)
          if [ -z "$installer" ]; then
            for f in build/bin/*.exe; do
              base=$(basename "$f")
              case "$base" in
                openbackup-desktop.exe) ;;
                *) installer=$f; break ;;
              esac
            done
          fi
          test -n "$installer"
          cp "$installer" dist/openbackup-desktop-windows-amd64-setup.exe
          ls -la dist
          test -f dist/openbackup-desktop-windows-amd64.exe
          test -f dist/openbackup-desktop-windows-amd64-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-windows
          path: desktop/dist/*
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: version
    if: needs.version.result == 'success' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop
        working-directory: desktop
        run: |
          set -eu
          (cd .. && go run ./internal/version/cmd stamp-wails desktop/wails.json)
          export COMMIT="${GITHUB_SHA::7}"
          LDFLAGS=$(cd .. && sh scripts/go-ldflags.sh .)
          wails build -trimpath -ldflags "$LDFLAGS" -tags webkit2_41
          mkdir -p dist
          cp build/bin/openbackup-desktop dist/openbackup-desktop-linux-amd64
          cp build/linux/openbackup-desktop.desktop dist/
          cp build/appicon.png dist/openbackup.png
          chmod 755 dist/openbackup-desktop-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-linux
          path: desktop/dist/*
          if-no-files-found: error

  docker:
    name: Publish Docker image
    needs: version
    if: needs.version.result == 'success' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version metadata
        id: meta
        run: |
          set -eu
          # GHCR requires lowercase names; official form is ghcr.io/<owner>/<repo>.
          image=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          tag='${{ needs.version.outputs.tag }}'
          ver='${{ needs.version.outputs.version }}'
          {
            echo "version=${tag}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "foisalislambd/openbackup:latest"
            echo "foisalislambd/openbackup:${tag}"
            echo "foisalislambd/openbackup:${ver}"
            echo "${image}:latest"
            echo "${image}:${tag}"
            echo "${image}:${ver}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=openbackup
            org.opencontainers.image.description=OpenBackup server
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Create GitHub Release
    needs: [version, cli, desktop-windows, desktop-linux, docker]
    if: needs.version.result == 'success' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          # Only release assets — not Docker buildx/GHA cache artifacts
          # (e.g. *.dockerbuild), which appear when the docker job runs in the
          # same workflow and break a blanket download.
          pattern: openbackup-*
          path: artifacts
          merge-multiple: false

      - name: Stage release files
        run: |
          set -eu
          mkdir -p release
          cp artifacts/openbackup-cli/* release/
          cp artifacts/openbackup-desktop-windows/* release/
          cp artifacts/openbackup-desktop-linux/* release/
          cd release
          # Refresh checksums for the full set of assets.
          sha256sum ./* > SHA256SUMS
          ls -la

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          extra=$(awk '
            { sub(/\r$/, "") }
            found { print; next }
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            { found = 1; next }
          ' VERSION.md)

          {
            printf '%s\n' \
              "## OpenBackup ${TAG}" \
              "" \
              "Release ${TAG} from VERSION.md on \`main\`." \
              "" \
              "### Downloads" \
              "- **Windows desktop:** \`openbackup-desktop-windows-amd64-setup.exe\` (installer) or \`.exe\` (portable) — window + background agent in one binary" \
              "- **Linux desktop:** \`openbackup-desktop-linux-amd64\` (+ \`.desktop\` + \`openbackup.png\`) — same: GUI + agent in one binary" \
              "- **Agent / server CLI:** \`openbackup-<os>-<arch>\` and \`openbackup-server-<os>-<arch>\` (optional; for headless/servers or the terminal)" \
              "- **Server container (Docker Hub):** \`docker pull foisalislambd/openbackup:${TAG}\` (also tagged \`latest\`)" \
              "- **Server container (GHCR):** \`docker pull ghcr.io/foisalislambd/openbackup:${TAG}\` (also tagged \`latest\`)" \
              "" \
              "### Notes" \
              "- Linux desktop needs WebKitGTK 4.1 at runtime (\`libwebkit2gtk-4.1-0\` on Debian/Ubuntu)." \
              "- macOS desktop is not built in CI yet — use \`make desktop\` on a Mac." \
              "- Agent/server CLI binaries are static; desktop apps are native per OS."
            if [ -n "$extra" ]; then
              printf '\n### VERSION.md\n\n%s\n' "$extra"
            fi
          } > release-notes.md

          gh release create "$TAG" release/* \
            --title "OpenBackup ${TAG}" \
            --notes-file release-notes.md \
            --latest
