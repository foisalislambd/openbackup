name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A backup tool that only works on the maintainer's machine is worthless, so the
# matrix runs the real tests on all three desktop platforms rather than trusting
# GOOS builds alone: file watching, permissions and path handling differ in ways
# only an actual run catches.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not ./... : the dashboard's node_modules can contain Go files from npm
  # packages, and those are not ours to build or test.
  PKGS: ./cmd/... ./internal/...

jobs:
  version:
    name: Version file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Invalid semver fails the check. A version that is not newer than the
      # latest tag / GitHub Release fails only when this PR changed the version
      # number — that PR is trying to cut a release that CI will not publish.
      # Leaving VERSION.md alone warns and still passes, so other work can merge.
      - name: Check VERSION.md against released versions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --tags --force origin
          tmp=$(mktemp)
          git tag -l 'v*' > "$tmp"
          gh release list --limit 200 --json tagName --jq '.[].tagName' >> "$tmp"

          changed=
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE"
            base_ref="origin/${PR_BASE}"
            if git cat-file -e "${base_ref}:VERSION.md" 2>/dev/null; then
              git show "${base_ref}:VERSION.md" > "${tmp}.base"
              base_ver=$(sh scripts/read-version.sh "${tmp}.base")
              head_ver=$(sh scripts/read-version.sh VERSION.md)
              if [ "$base_ver" != "$head_ver" ]; then
                changed=--changed
              fi
            else
              changed=--changed
            fi
          fi

          out=$(go run ./internal/version/cmd pr-check $changed < "$tmp")
          printf '%s\n' "$out"
          status=$(printf '%s\n' "$out" | awk -F= '/^status=/{print substr($0, index($0, "=")+1); exit}')
          message=$(printf '%s\n' "$out" | awk -F= '/^message=/{print substr($0, index($0, "=")+1); exit}')
          case "$status" in
            ok)
              echo "::notice title=Version::$message"
              ;;
            warn)
              echo "::warning title=Version::$message"
              ;;
            fail)
              echo "::error title=Version::$message"
              exit 1
              ;;
            *)
              echo "::error title=Version::could not read the version check result"
              printf '%s\n' "$out"
              exit 1
              ;;
          esac

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        shell: bash
        run: go build -trimpath -ldflags "$(sh scripts/go-ldflags.sh .)" ${{ env.PKGS }}

      - name: Test
        run: go test -count=1 ${{ env.PKGS }}

      # The race detector only on Linux: it is slow, and a data race is not
      # platform specific.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ${{ env.PKGS }}

  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/node_modules/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ${{ env.PKGS }}

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The installers are the first thing a user runs, and they are shipped as
      # text rather than compiled, so nothing else would catch a typo in them.
      - name: Check the shell scripts
        run: |
          for f in scripts/*.sh; do
            sh -n "$f" || exit 1
            shellcheck -s sh "$f" || exit 1
          done

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Users install the agent on whatever they own, so every target must build
      # from one machine with no cgo.
      - name: Build every target
        run: |
          set -eu
          ldflags=$(sh scripts/go-ldflags.sh .)
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            # PKGS is several paths; word splitting is the list of packages.
            # shellcheck disable=SC2086
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" $PKGS
            echo "::endgroup::"
          done

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npm run build
        working-directory: web

      # Prove the export can actually be embedded, which is how it ships.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Embed the dashboard and build the server
        run: |
          rm -rf internal/server/web/dist
          mkdir -p internal/server/web/dist
          cp -r web/dist/. internal/server/web/dist/
          go build -trimpath -ldflags "$(sh scripts/go-ldflags.sh .)" ./cmd/openbackup-server

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Wails links against the platform's webview, so the Linux runner needs the
      # WebKitGTK headers. Ubuntu 24.04 (ubuntu-latest) ships webkit2gtk-4.1, and
      # Wails needs the matching build tag — without it pkg-config looks for the
      # removed 4.0 package and the compile fails. Windows builds against
      # WebView2, which ships with the OS.
      - name: Install the Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - run: npm ci --no-audit --no-fund
        working-directory: desktop/frontend
      - run: npm run typecheck
        working-directory: desktop/frontend

      - name: go vet
        run: go vet ./...
        working-directory: desktop

      # Wails builds the frontend itself, so this also proves the embed works.
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          (cd .. && go run ./internal/version/cmd stamp-wails desktop/wails.json)
          ldflags=$(cd .. && sh scripts/go-ldflags.sh .)
          wails build -trimpath -ldflags "$ldflags" -tags webkit2_41
          arch=$(uname -m)
          case "$arch" in x86_64|amd64) goarch=amd64 ;; aarch64|arm64) goarch=arm64 ;; *) echo "unsupported $arch"; exit 1 ;; esac
          cp build/bin/openbackup-desktop "build/bin/openbackup-desktop-linux-${goarch}"
          cp build/linux/openbackup-desktop.desktop build/bin/
          cp build/appicon.png build/bin/openbackup.png
        working-directory: desktop

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          (cd .. && go run ./internal/version/cmd stamp-wails desktop/wails.json)
          ldflags=$(cd .. && sh scripts/go-ldflags.sh .)
          wails build -trimpath -ldflags "$ldflags"
        working-directory: desktop

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The installer is what a user actually downloads, so a broken one must fail.
      - name: Build the installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          makensis -VERSION
          ldflags=$(cd .. && sh scripts/go-ldflags.sh .)
          wails build -nsis -trimpath -ldflags "$ldflags"
        working-directory: desktop

      - name: Upload the Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-windows
          path: |
            desktop/build/bin/*.exe
          if-no-files-found: error

      - name: Upload the Linux build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: openbackup-desktop-linux
          path: |
            desktop/build/bin/openbackup-desktop-linux-*
            desktop/build/bin/openbackup-desktop.desktop
            desktop/build/bin/openbackup.png
          if-no-files-found: error

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Version metadata
        id: meta
        run: |
          set -eu
          ver=$(sh scripts/read-version.sh)
          {
            echo "version=v${ver}"
            echo "commit=$(git rev-parse --short=7 HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: foisalislambd/openbackup:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that starts but does not serve is not a passing build.
      - name: Smoke test the image
        run: |
          docker run -d --name ob -p 18200:18200 \
            -e OPENBACKUP_ADMIN_EMAIL=ci@example.com \
            -e OPENBACKUP_ADMIN_PASSWORD=a-long-enough-password \
            foisalislambd/openbackup:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18200/api/v1/health >/dev/null; then break; fi
            echo "waiting for server ($i)..."
            docker logs ob 2>&1 | tail -20 || true
            sleep 1
          done
          curl -fsS http://127.0.0.1:18200/api/v1/health
          # The dashboard must be embedded in the published image.
          curl -fsS http://127.0.0.1:18200/ | grep -q OpenBackup
          docker logs ob

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The image has no shell and no agent. The agent runs on the runner and
      # the server under test is the image just built.
      - name: Backup and restore through the image
        run: |
          go build -o bin/openbackup ./cmd/openbackup
          sh scripts/docker-roundtrip.sh ob http://127.0.0.1:18200

      - name: Stop the container
        if: always()
        run: docker rm -f ob

  s3:
    name: S3-compatible storage
    runs-on: ubuntu-latest
    services:
      # Adobe S3 mock, not AWS and not MinIO. The digest is the image the
      # local round trip passed against. MinIO's registry was not reachable
      # from the development environment.
      s3mock:
        image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        env:
          initialBuckets: openbackup-test
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Wait for the local S3 server
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9090/ >/dev/null; then
              exit 0
            fi
            echo "waiting for s3 mock ($i)..."
            sleep 1
          done
          exit 1

      - name: Round trip
        env:
          OB_S3_ENDPOINT: 127.0.0.1:9090
          OB_S3_REQUIRED: "1"
          OB_S3_ACCESS_KEY: any
          OB_S3_SECRET_KEY: any
          OB_S3_BUCKET: openbackup-test
          OB_S3_USE_SSL: "false"
        run: go test -count=1 -run 'TestS3' ./internal/server/store/ ./internal/server/httpapi/
