name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A backup tool that only works on the maintainer's machine is worthless, so the
# matrix runs the real tests on all three desktop platforms rather than trusting
# GOOS builds alone: file watching, permissions and path handling differ in ways
# only an actual run catches.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not ./... : the dashboard's node_modules can contain Go files from npm
  # packages, and those are not ours to build or test.
  PKGS: ./cmd/... ./internal/...

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ${{ env.PKGS }}

      - name: Test
        run: go test -count=1 ${{ env.PKGS }}

      # The race detector only on Linux: it is slow, and a data race is not
      # platform specific.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ${{ env.PKGS }}

  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/node_modules/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ${{ env.PKGS }}

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The installers are the first thing a user runs, and they are shipped as
      # text rather than compiled, so nothing else would catch a typo in them.
      - name: Check the shell scripts
        run: |
          for f in scripts/*.sh internal/server/httpapi/install.sh; do
            sh -n "$f" || exit 1
            shellcheck -s sh "$f" || exit 1
          done

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Users install the agent on whatever they own, so every target must build
      # from one machine with no cgo.
      - name: Build every target
        run: |
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build $PKGS
            echo "::endgroup::"
          done

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npm run build
        working-directory: web

      # Prove the export can actually be embedded, which is how it ships.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Embed the dashboard and build the server
        run: |
          rm -rf internal/server/web/dist
          mkdir -p internal/server/web/dist
          cp -r web/out/. internal/server/web/dist/
          go build ./cmd/openbackup-server

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Wails links against the platform's webview, so the Linux runner needs the
      # WebKitGTK headers. Windows builds against WebView2, which ships with the
      # OS.
      - name: Install the Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - run: npm ci --no-audit --no-fund
        working-directory: desktop/frontend
      - run: npm run typecheck
        working-directory: desktop/frontend

      - name: go vet
        run: go vet ./...
        working-directory: desktop

      # Wails builds the frontend itself, so this also proves the embed works.
      - name: Build
        run: wails build
        working-directory: desktop

      # NSIS is preinstalled on the Windows runner, and the installer is what a
      # user actually downloads, so a broken one must fail the build.
      - name: Build the installer
        if: matrix.os == 'windows-latest'
        run: wails build -nsis
        working-directory: desktop

      - name: Upload the Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: openbackup-desktop-windows
          path: |
            desktop/build/bin/*.exe
          if-no-files-found: error

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openbackup/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that starts but does not serve is not a passing build.
      - name: Smoke test the image
        run: |
          docker run -d --name ob -p 8080:8080 \
            -e OPENBACKUP_ADMIN_EMAIL=ci@example.com \
            -e OPENBACKUP_ADMIN_PASSWORD=a-long-enough-password \
            openbackup/server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health
          # The dashboard must be embedded in the published image.
          curl -fsS http://127.0.0.1:8080/ | grep -q OpenBackup
          # And the one-command agent install must be served.
          curl -fsS http://127.0.0.1:8080/install.sh | head -1 | grep -q '#!/bin/sh'
          docker logs ob
          docker rm -f ob
